[project]
name = "ai-gov-graph"
version = "0.1.0"
description = "Progressively discover and build a GOV.UK knowledge graph using AI."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain-openrouter>=0.1.0",
    "langgraph>=1.0.0",
    "pyoxigraph>=0.5.0",
    "typer>=0.27.1",
]

[project.scripts]
aigg = "aigg.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ty>=0.0.72",
]

[tool.uv]
default-groups = ["dev"]
upgrade-package = ["ruff"]

[tool.ruff]
exclude = [
    "*.ipynb"
]
line-length = 88
indent-width = 4
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "D",
    "UP",
    "TID",
    "BLE",
    "PLC",
    "SIM",
    "ANN",
]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
"**/{test,docs}/*" = ["D"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
